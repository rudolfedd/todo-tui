name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  linux:
    name: Linux (gcc, ncurses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Build with sanitizers
        run: make clean && make DEBUG=1 && ./tests/test_json

  windows:
    name: Windows (mingw64, PDCurses)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pdcurses
            make

      - name: Build
        run: ./build-msys2.sh

      - name: Test
        run: gcc -std=c11 -O1 -Wall -Wextra -Isrc -o tests/test_json.exe tests/test_json.c src/json.c src/util.c && ./tests/test_json.exe
